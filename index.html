<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة تقصير الروابط مع عداد الزوار</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.15);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.15);
            --warning: #f59e0b;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Tajawal', 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(16, 185, 129, 0.06) 0%, transparent 60%);
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 36px 30px;
            box-shadow: var(--shadow);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .header .icon {
            font-size: 52px;
            margin-bottom: 8px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #f1f5f9;
        }
        .header p {
            color: var(--text-secondary);
            margin-top: 4px;
            font-size: 15px;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1;
            min-width: 100px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px 14px;
            text-align: center;
            transition: var(--transition);
        }
        .stat-card:hover {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.05);
        }
        .stat-card .stat-number {
            font-size: 30px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.5px;
        }
        .stat-card .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Form */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #cbd5e1;
        }
        .input-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        input[type="url"],
        input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
            transition: var(--transition);
            direction: ltr;
            text-align: left;
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
            background: rgba(255, 255, 255, 0.06);
        }
        input::placeholder {
            color: #64748b;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            letter-spacing: -0.2px;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
        }
        .btn-primary:active {
            transform: translateY(0);
            box-shadow: none;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(59, 130, 246, 0.06);
        }
        .btn-sm {
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 7px;
        }
        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-success:hover {
            filter: brightness(1.1);
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }
        .btn-danger {
            background: transparent;
            border: 1.5px solid var(--danger);
            color: var(--danger);
        }
        .btn-danger:hover {
            background: var(--danger-bg);
        }

        /* Result */
        .result-area {
            margin-top: 10px;
            padding: 16px;
            background: var(--success-bg);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: var(--radius-sm);
            display: none;
            animation: fadeIn 0.35s ease;
        }
        .result-area.show {
            display: block;
        }
        .result-area .short-url {
            font-size: 17px;
            font-weight: 600;
            color: var(--success);
            word-break: break-all;
            direction: ltr;
            text-align: left;
            display: inline-block;
            margin-bottom: 8px;
        }
        .result-area .row-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Table */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin: 28px 0 14px;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .table-wrapper {
            overflow-x: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 500px;
        }
        th,
        td {
            padding: 12px 14px;
            text-align: right;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        td {
            color: #cbd5e1;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }
        .td-url {
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            direction: ltr;
            text-align: left;
            display: block;
        }
        .td-code {
            font-family: 'Courier New', monospace;
            color: var(--accent);
            font-weight: 600;
            direction: ltr;
            text-align: left;
        }
        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: #334155;
            color: #f1f5f9;
            padding: 12px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            z-index: 999;
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 32px 16px;
            color: var(--text-secondary);
        }
        .empty-state .emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .container {
                padding: 20px 14px;
                border-radius: 12px;
            }
            .header h1 {
                font-size: 22px;
            }
            .btn {
                padding: 12px 16px;
                font-size: 14px;
            }
            .stat-card .stat-number {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="icon">🔗</div>
            <h1>أداة تقصير الروابط</h1>
            <p>اختصر روابطك الطويلة وتابع عدد الزوار بسهولة</p>
        </div>

        <!-- Stats -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-number" id="totalLinks">0</div>
                <div class="stat-label">إجمالي الروابط</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalVisitors">0</div>
                <div class="stat-label">إجمالي الزوار</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="todayVisitors">0</div>
                <div class="stat-label">زوار اليوم</div>
            </div>
        </div>

        <!-- Form -->
        <div class="form-group">
            <label for="urlInput">🔗 الرابط الأصلي الطويل</label>
            <div class="input-row">
                <input type="url" id="urlInput" placeholder="https://example.com/very-long-url-here..." required>
                <button class="btn btn-primary" id="shortenBtn" title="اختصر الرابط">
                    ✂️ اختصر الآن
                </button>
            </div>
        </div>

        <!-- Result -->
        <div class="result-area" id="resultArea">
            <span>✅ تم إنشاء الرابط المختصر:</span><br>
            <span class="short-url" id="shortUrlDisplay"></span>
            <div class="row-btns">
                <button class="btn btn-success btn-sm" id="copyBtn">📋 نسخ الرابط</button>
                <button class="btn btn-outline btn-sm" id="openBtn">🌐 فتح الرابط</button>
            </div>
        </div>

        <!-- Links Table -->
        <div class="section-title">📊 جميع الروابط المختصرة</div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>الرمز</th>
                        <th>الرابط الأصلي</th>
                        <th>عدد الزوار</th>
                        <th>تاريخ الإنشاء</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="5">
                            <div class="empty-state">
                                <span class="emoji">📭</span>
                                لا توجد روابط مختصرة حتى الآن
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            // ============ DOM Elements ============
            const urlInput = document.getElementById('urlInput');
            const shortenBtn = document.getElementById('shortenBtn');
            const resultArea = document.getElementById('resultArea');
            const shortUrlDisplay = document.getElementById('shortUrlDisplay');
            const copyBtn = document.getElementById('copyBtn');
            const openBtn = document.getElementById('openBtn');
            const tableBody = document.getElementById('tableBody');
            const totalLinksEl = document.getElementById('totalLinks');
            const totalVisitorsEl = document.getElementById('totalVisitors');
            const todayVisitorsEl = document.getElementById('todayVisitors');
            const toast = document.getElementById('toast');

            // ============ Storage Keys ============
            const STORAGE_LINKS = 'url_shortener_links';
            const STORAGE_TOTAL_VISITORS = 'url_shortener_total_visitors';
            const STORAGE_DAILY_VISITORS = 'url_shortener_daily_visitors';
            const STORAGE_DAILY_DATE = 'url_shortener_daily_date';

            // ============ State ============
            let linksData = {}; // { code: { originalUrl, visitors, createdAt } }
            let currentShortCode = null;

            // ============ Load Data ============
            function loadLinksData() {
                try {
                    const raw = localStorage.getItem(STORAGE_LINKS);
                    linksData = raw ? JSON.parse(raw) : {};
                } catch (e) {
                    linksData = {};
                }
            }

            function saveLinksData() {
                localStorage.setItem(STORAGE_LINKS, JSON.stringify(linksData));
            }

            function getTotalVisitors() {
                return parseInt(localStorage.getItem(STORAGE_TOTAL_VISITORS) || '0');
            }

            function incrementTotalVisitors() {
                const current = getTotalVisitors();
                localStorage.setItem(STORAGE_TOTAL_VISITORS, (current + 1).toString());
                return current + 1;
            }

            function getDailyVisitors() {
                const today = new Date().toDateString();
                const storedDate = localStorage.getItem(STORAGE_DAILY_DATE);
                if (storedDate !== today) {
                    // Reset daily counter
                    localStorage.setItem(STORAGE_DAILY_DATE, today);
                    localStorage.setItem(STORAGE_DAILY_VISITORS, '0');
                    return 0;
                }
                return parseInt(localStorage.getItem(STORAGE_DAILY_VISITORS) || '0');
            }

            function incrementDailyVisitors() {
                const today = new Date().toDateString();
                const storedDate = localStorage.getItem(STORAGE_DAILY_DATE);
                if (storedDate !== today) {
                    localStorage.setItem(STORAGE_DAILY_DATE, today);
                    localStorage.setItem(STORAGE_DAILY_VISITORS, '1');
                    return 1;
                }
                const current = parseInt(localStorage.getItem(STORAGE_DAILY_VISITORS) || '0');
                localStorage.setItem(STORAGE_DAILY_VISITORS, (current + 1).toString());
                return current + 1;
            }

            // ============ Generate Short Code ============
            function generateShortCode(length = 6) {
                const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let code = '';
                for (let i = 0; i < length; i++) {
                    code += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                // Ensure uniqueness
                if (linksData[code]) {
                    return generateShortCode(length);
                }
                return code;
            }

            // ============ Build Short URL ============
            function buildShortUrl(code) {
                const base = window.location.origin + window.location.pathname;
                // Remove trailing index.html if present for cleaner URLs
                const cleanBase = base.replace(/\/index\.html$/, '/').replace(/\/$/, '');
                return cleanBase + '#' + code;
            }

            // ============ Toast ============
            let toastTimer;

            function showToast(message) {
                clearTimeout(toastTimer);
                toast.textContent = message;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2200);
            }

            // ============ Copy to Clipboard ============
            async function copyToClipboard(text) {
                try {
                    await navigator.clipboard.writeText(text);
                    showToast('✅ تم نسخ الرابط بنجاح!');
                } catch (err) {
                    // Fallback
                    const tempInput = document.createElement('input');
                    tempInput.value = text;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    document.execCommand('copy');
                    document.body.removeChild(tempInput);
                    showToast('✅ تم نسخ الرابط بنجاح!');
                }
            }

            // ============ Shorten URL ============
            function shortenUrl() {
                let originalUrl = urlInput.value.trim();

                if (!originalUrl) {
                    showToast('⚠️ الرجاء إدخال رابط صحيح');
                    urlInput.focus();
                    return;
                }

                // Add https:// if missing
                if (!/^https?:\/\//i.test(originalUrl)) {
                    originalUrl = 'https://' + originalUrl;
                }

                // Validate URL
                try {
                    new URL(originalUrl);
                } catch (e) {
                    showToast('⚠️ الرجاء إدخال رابط صالح');
                    urlInput.focus();
                    return;
                }

                const code = generateShortCode();
                const now = new Date();
                const createdAt = now.toLocaleDateString('ar-SA', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                });

                linksData[code] = {
                    originalUrl: originalUrl,
                    visitors: 0,
                    createdAt: createdAt,
                };

                saveLinksData();
                currentShortCode = code;
                const shortUrl = buildShortUrl(code);
                shortUrlDisplay.textContent = shortUrl;
                resultArea.classList.add('show');
                urlInput.value = '';
                renderTable();
                updateStats();
                showToast('🎉 تم تقصير الرابط بنجاح!');

                // Scroll to result
                resultArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            // ============ Handle Redirect ============
            function handleRedirect() {
                const hash = window.location.hash.substring(1); // Remove #
                if (!hash) return false;

                // Check if the hash matches a stored short code
                if (linksData[hash]) {
                    // Increment visitor count for this link
                    linksData[hash].visitors = (linksData[hash].visitors || 0) + 1;
                    saveLinksData();
                    incrementTotalVisitors();
                    incrementDailyVisitors();
                    updateStats();

                    // Redirect to original URL
                    const originalUrl = linksData[hash].originalUrl;
                    // Brief delay to allow stats to save
                    setTimeout(() => {
                        window.location.href = originalUrl;
                    }, 150);
                    return true;
                }
                return false;
            }

            // ============ Render Table ============
            function renderTable() {
                const entries = Object.entries(linksData);

                if (entries.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="5">
                                <div class="empty-state">
                                    <span class="emoji">📭</span>
                                    لا توجد روابط مختصرة حتى الآن
                                </div>
                            </td>
                        </tr>`;
                    return;
                }

                // Sort by creation date (most recent first) - we use visitor count as proxy
                // Actually let's sort by the order they appear (no inherent order in object)
                // We'll reverse to show newest first (since objects maintain insertion order in modern JS)
                const reversedEntries = entries.reverse();

                tableBody.innerHTML = reversedEntries
                    .map(([code, data]) => {
                        const shortUrl = buildShortUrl(code);
                        const truncatedUrl =
                            data.originalUrl.length > 35 ?
                            data.originalUrl.substring(0, 35) + '...' :
                            data.originalUrl;
                        return `
                        <tr>
                            <td><span class="td-code">${escapeHTML(code)}</span></td>
                            <td><span class="td-url" title="${escapeHTML(data.originalUrl)}">${escapeHTML(truncatedUrl)}</span></td>
                            <td><span class="badge">👁 ${data.visitors || 0}</span></td>
                            <td>${escapeHTML(data.createdAt || '—')}</td>
                            <td>
                                <button class="btn btn-outline btn-sm copy-link-btn" data-code="${escapeHTML(code)}" title="نسخ الرابط المختصر">📋</button>
                                <button class="btn btn-outline btn-sm open-link-btn" data-code="${escapeHTML(code)}" title="فتح الرابط الأصلي">🌐</button>
                                <button class="btn btn-danger btn-sm delete-btn" data-code="${escapeHTML(code)}" title="حذف">🗑</button>
                            </td>
                        </tr>`;
                    })
                    .join('');

                // Attach event listeners to buttons
                tableBody.querySelectorAll('.copy-link-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const code = btn.getAttribute('data-code');
                        copyToClipboard(buildShortUrl(code));
                    });
                });

                tableBody.querySelectorAll('.open-link-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const code = btn.getAttribute('data-code');
                        if (linksData[code]) {
                            window.open(linksData[code].originalUrl, '_blank');
                        }
                    });
                });

                tableBody.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const code = btn.getAttribute('data-code');
                        if (confirm('هل أنت متأكد من حذف هذا الرابط المختصر؟')) {
                            delete linksData[code];
                            saveLinksData();
                            if (currentShortCode === code) {
                                currentShortCode = null;
                                resultArea.classList.remove('show');
                            }
                            renderTable();
                            updateStats();
                            showToast('🗑 تم حذف الرابط بنجاح');
                        }
                    });
                });
            }

            // ============ Update Stats ============
            function updateStats() {
                const totalLinks = Object.keys(linksData).length;
                const totalVisitorsAll = Object.values(linksData).reduce((sum, d) => sum + (d.visitors || 0),
                0);
                const dailyVisitors = getDailyVisitors();

                totalLinksEl.textContent = totalLinks;
                totalVisitorsEl.textContent = totalVisitorsAll;
                todayVisitorsEl.textContent = dailyVisitors;
            }

            // ============ Escape HTML ============
            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ============ Event Listeners ============
            shortenBtn.addEventListener('click', shortenUrl);
            urlInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    shortenUrl();
                }
            });

            copyBtn.addEventListener('click', () => {
                if (currentShortCode) {
                    copyToClipboard(buildShortUrl(currentShortCode));
                }
            });

            openBtn.addEventListener('click', () => {
                if (currentShortCode && linksData[currentShortCode]) {
                    window.open(linksData[currentShortCode].originalUrl, '_blank');
                }
            });

            // ============ Initialize ============
            function init() {
                loadLinksData();

                // Check if there's a hash for redirection
                const hash = window.location.hash.substring(1);
                if (hash && linksData[hash]) {
                    // This is a redirect visit
                    handleRedirect();
                    // After redirect, the page will navigate away
                    // But we still render everything for the brief moment
                }

                renderTable();
                updateStats();

                // If we came from a redirect that didn't navigate (edge case), clear hash
                if (hash && !linksData[hash] && hash.length > 0) {
                    // Invalid short code - show message
                    showToast('⚠️ الرمز المختصر غير موجود');
                    // Clear the hash after a moment
                    setTimeout(() => {
                        if (window.location.hash.substring(1) === hash) {
                            history.replaceState(null, '', window.location.pathname);
                        }
                    }, 2000);
                }

                // Track page visit (only for the main page, not redirects)
                if (!hash || !linksData[hash]) {
                    incrementTotalVisitors();
                    incrementDailyVisitors();
                    updateStats();
                }
            }

            init();

        })();
